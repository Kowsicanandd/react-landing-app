name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Enable Swap Memory on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: "30s"
          script: |
            if [ ! -f /swapfile ]; then
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi
            sudo swapon /swapfile
            free -h

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: "60s"
          script: |
            cd ~/my-react-app/tailwind-landing-page-template-main || cd ~/tailwind-landing-page-template-main || cd ~
            git pull origin main
            npm install 
            NODE_OPTIONS="--max-old-space-size=1024" npm run build
            pm2 restart all || pm2 start npm --name "react-landing" -- start

      - name: Add Live Website Link to Summary
        run: |
          echo "### 🚀 Live Website" >> $GITHUB_STEP_SUMMARY
          echo "Your app has been successfully deployed and is live at:" >> $GITHUB_STEP_SUMMARY
          echo "[Open Live Website](http://${{ secrets.EC2_HOST }})" >> $GITHUB_STEP_SUMMARY