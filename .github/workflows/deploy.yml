name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4[cite: 1]

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0[cite: 1]
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2 via SSH
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << EOF
            cd ~/my-react-app/tailwind-landing-page-template-main
            git remote set-url origin https://$PAT@github.com/Kowsicanandd/my-react-app.git
            git pull origin main
            npm install
            NODE_OPTIONS="--max-old-space-size=512" npm run build
            pm2 restart all || pm2 start npm --name "tailwind-landing" -- start
            pm2 save
          EOF