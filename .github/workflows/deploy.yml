name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Enable Swap Memory on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: "30s"
          script: |
            if [ ! -f /swapfile ]; then
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi
            sudo swapon /swapfile
            free -h

      - name: Deploy to EC2 via SSH
        env:
          HOST: ${{ vars.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          PAT_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << EOF
            set -e

            cd ~/my-react-app

            git remote set-url origin https://$PAT_TOKEN@github.com/Kowsicanandd/my-react-app.git

            git pull origin main

            cd tailwind-landing-page-template-main

            npm install

            NODE_OPTIONS="--max-old-space-size=512" npm run build

            pm2 restart tailwind-landing || pm2 start npm --name "tailwind-landing" -- start

            pm2 save
          EOF

      - name: Add Live Website Link to Summary
        env:
          HOST: ${{ vars.EC2_HOST }}
        run: |
          echo "### 🚀 Live Website" >> $GITHUB_STEP_SUMMARY
          echo "Your app has been successfully deployed and is live at:" >> $GITHUB_STEP_SUMMARY
          echo "[Open Live Website](http://$HOST)" >> $GITHUB_STEP_SUMMARY